name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n plugin/etc/rc.syshook.d/start/50-xray
      - name: PHP syntax
        run: |
          find plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML syntax
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('plugin').rglob('*.xml'):
              ET.parse(path)
              print(f'OK {path}')
          PY
      - name: Import parser regression
        run: php tests/import_parser_test.php
      - name: Release integrity
        run: |
          test "$(cat VERSION)" = "1.1.0"
          ! grep -RniE --exclude-dir=.git --exclude='ci.yml' \
            '1\.1\.0-(rc|beta)|1\.1\.1-dev|0\.2\.[0-9]+|TESTING\.ru|preserved lab configuration' .
          ! grep -RniE 'ws_path|ws_host|httpupgrade_path|httpupgrade_host' plugin
          test ! -e plugin/mvc/app/controllers/OPNsense/Xray/LogsController.php
          ! grep -RniE "section == 'logs'|currentSection === 'logs'" plugin/mvc/app/views/OPNsense/Xray
          grep -Fq '<vless_flow type="OptionField">' plugin/mvc/app/models/OPNsense/Xray/Instance.xml
          grep -Fq "\$user['flow'] = \$flow" plugin/scripts/Xray/xray-service-control.php
          grep -Fq "if (\$arg1 === 'release')" plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq 'releaseGatewayHealthOwnership' plugin/mvc/app/controllers/OPNsense/Xray/Api/InstanceController.php
          grep -Fq "elseif (\$failures >= 3)" plugin/scripts/Xray/xray-health.php
          grep -Fq "\$healthState === 'unknown' || \$healthState === 'stale'" plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq 'gs_synthetic_gateway_for_instance' plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq "'fargw'=>'1'" plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq 'Disable Dynamic Gateway Policy' plugin/scripts/Xray/xray-gateway-sync.php
          ! grep -Fq "'gateway'=>'dynamic'" plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq "if (\$trackedUuid !== '')" plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq "\$registry[\$uuid]['uuid'] = \$createdUuid" plugin/scripts/Xray/xray-gateway-sync.php
          grep -Fq "config-*.json.auto" plugin/scripts/Xray/xray-service-control.php
          grep -Fq "xray-stopped-*.flag" plugin/scripts/Xray/xray-service-control.php
          grep -Fq 'Copyright (c) 2026, Pavel' LICENSE
