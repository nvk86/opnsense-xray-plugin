# Xray+HEV plugin logs.
# Only UUID-named per-instance logs use the HUP helper. Watchdog/service logs
# are rotated separately and must not match the instance wildcard.
/var/log/xray-[0-9a-fA-F]*.log root:wheel 640 3 5120 * JGR /usr/local/opnsense/scripts/Xray/xray-logrotate-hup.php
/var/log/xray-watchdog.log      root:wheel 640 3 1024 * JN
/var/log/xray-service.log       root:wheel 640 3 1024 * JN
