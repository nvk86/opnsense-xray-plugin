[start]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php start
parameters:
type:script_output
message:Starting Xray
allowed_groups:wheel,wwwonly

[stop]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php stop
parameters:
type:script_output
message:Stopping Xray
allowed_groups:wheel,wwwonly

[restart]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php restart
parameters:
type:script_output
message:Restarting Xray
allowed_groups:wheel,wwwonly

[reconfigure]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php reconfigure
parameters:
type:script_output
message:Reconfiguring Xray
allowed_groups:wheel,wwwonly

[start_instance]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php start_instance
parameters:%s
type:script_output
message:Starting Xray instance
allowed_groups:wheel,wwwonly

[stop_instance]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php stop_instance
parameters:%s
type:script_output
message:Stopping Xray instance
allowed_groups:wheel,wwwonly

[restart_instance]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php restart_instance
parameters:%s
type:script_output
message:Restarting Xray instance
allowed_groups:wheel,wwwonly

[status]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php status
parameters:
type:script_output
message:Xray status
allowed_groups:wheel,wwwonly

[status_instance]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php status
parameters:%s
type:script_output
message:Xray instance status
allowed_groups:wheel,wwwonly

[statusall]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php statusall
parameters:
type:script_output
message:Xray status all instances
allowed_groups:wheel,wwwonly

[xraylog]
command:/usr/local/opnsense/scripts/Xray/xray-log.php
parameters:%s
type:script_output
message:Xray instance log
allowed_groups:wheel,wwwonly

[testconnect]
command:/usr/local/opnsense/scripts/Xray/xray-testconnect.php
parameters:%s
type:script_output
message:Xray runtime test
allowed_groups:wheel,wwwonly

[validate]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php validate
parameters:
type:script_output
message:Validate Xray config
allowed_groups:wheel,wwwonly

[validate_instance]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php validate
parameters:%s
type:script_output
message:Validate Xray instance config
allowed_groups:wheel,wwwonly

[ifstats]
command:/usr/local/opnsense/scripts/Xray/xray-ifstats.php
parameters:%s
type:script_output
message:Xray + HEV TUN diagnostics
allowed_groups:wheel,wwwonly

[version]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php version
parameters:
type:script_output
message:Xray plugin version
allowed_groups:wheel,wwwonly

[watchdog]
command:/usr/local/opnsense/scripts/Xray/xray-watchdog.php
parameters:
type:script_output
message:Xray watchdog check
allowed_groups:wheel,wwwonly

[log]
command:/usr/bin/tail
parameters:-n 200 /var/log/xray-service.log
type:script_output
message:Xray service log
allowed_groups:wheel,wwwonly

[watchdoglog]
command:/usr/bin/tail
parameters:-n 200 /var/log/xray-watchdog.log
type:script_output
message:Xray watchdog log
allowed_groups:wheel,wwwonly

[gateway_sync]
command:/usr/local/opnsense/scripts/Xray/xray-gateway-sync.php
parameters:%s
type:script_output
message:Synchronize Xray health with native gateway state
allowed_groups:wheel,wwwonly
